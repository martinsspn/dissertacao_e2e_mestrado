{% extends "layout.html" %}

{% block content %}
<header class="page-header">
  <h1>Grafo</h1>
  <p>{{ summary.pages }} paginas · {{ summary.transitions }} transicoes</p>
</header>

{% if summary.error %}
<section class="notice error">{{ summary.error }}</section>
{% endif %}

<section class="graph-layout">
  <div class="graph-canvas-wrap">
    <canvas id="graphCanvas" width="1100" height="680"></canvas>
  </div>
  <aside class="detail-panel">
    <h2>Selecao</h2>
    <pre id="graphDetails">{}</pre>
  </aside>
</section>

<script id="graph-data" type="application/json">{{ graph_data | tojson }}</script>
{% endblock %}
