[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-e2e-web-app"
version = "0.1.0"
description = "Interface local para operar o pipeline de prompts E2E com contexto estruturado."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "neo4j==5.16.0",
]

[project.scripts]
semantic-e2e-web = "web_app.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["web_app*"]
