[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-e2e"
version = "0.1.0"
description = "Gera testes E2E Playwright a partir de especificacoes em linguagem natural e Neo4j"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "neo4j==5.16.0",
  "requests==2.32.3",
]

[project.scripts]
semantic-e2e = "semantic_e2e.presentation.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_e2e*"]
