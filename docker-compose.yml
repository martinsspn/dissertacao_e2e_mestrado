services:
  neo4j:
    image: neo4j:5.20
    container_name: neo4j_graph
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - rede_dissertacao

  # 1. Navegador Chrome isolado (Selenium Grid standalone)
  selenium_chrome:
    image: selenium/standalone-chrome:4.9.0-20230421
    container_name: selenium_chrome
    shm_size: '2gb'
    ports:
      - "4444:4444"
    networks:
      - rede_dissertacao

  # 2. Explorador Java (Crawljax)
  crawljax_java:
    build: 
      context: ./crawljax_explorer
    container_name: crawljax_explorer_runner
    volumes:
      - ./output_crawljax:/app/output # Pasta onde os HTMLs serão salvos
    environment: 
      - TARGET_URL=https://demowebshop.tricentis.com/
      - SELENIUM_HUB_URL=http://selenium_chrome:4444/wd/hub
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j_password
      - CRAWL_MAX_DEPTH=8
      - CRAWL_MAX_STATES=400
      - CRAWL_MAX_RUNTIME_MINUTES=45
      - CRAWL_WAIT_AFTER_RELOAD_MS=3000
      - CRAWL_WAIT_AFTER_EVENT_MS=2200
      - CRAWL_CLICK_ONCE=false
      - CRAWL_RANDOM_ORDER=true
      - SELENIUM_READY_TIMEOUT_SECONDS=180
      - SELENIUM_READY_REQUIRED=false
    depends_on:
      - neo4j
      - selenium_chrome
    networks:
      - rede_dissertacao

  # 3. Motor Semântico (Python)
  python_enricher:
    build: 
      context: ./python_app
    container_name: python_motor_semantico
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4.1-mini}
    volumes:
      - ./python_app:/app
      - ./output_crawljax:/app/data_input # Pasta de onde os HTMLs serão lidos
    networks:
      - rede_dissertacao
    command: tail -f /dev/null 

networks:
  rede_dissertacao:
    driver: bridge

volumes:
  neo4j_data: