services:
  neo4j:
    image: neo4j:5.20
    container_name: neo4j_graph
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - rede_dissertacao

  selenium_chrome:
    image: selenium/standalone-chrome:4.9.0-20230421
    container_name: selenium_chrome
    shm_size: "2gb"
    ports:
      - "4444:4444"
    networks:
      - rede_dissertacao

  crawljax_java:
    build:
      context: ./crawljax_explorer
    container_name: crawljax_explorer_runner
    profiles:
      - tools
    volumes:
      - ./output_crawljax:/app/output
    environment:
      - TARGET_URL=${TARGET_URL:-https://demowebshop.tricentis.com/}
      - CRAWL_MAX_DEPTH=${CRAWL_MAX_DEPTH:-8}
      - CRAWL_MAX_STATES=${CRAWL_MAX_STATES:-400}
      - CRAWL_MAX_RUNTIME_MINUTES=${CRAWL_MAX_RUNTIME_MINUTES:-45}
      - CRAWL_WAIT_AFTER_RELOAD_MS=${CRAWL_WAIT_AFTER_RELOAD_MS:-3000}
      - CRAWL_WAIT_AFTER_EVENT_MS=${CRAWL_WAIT_AFTER_EVENT_MS:-2200}
      - CRAWL_CLICK_ONCE=${CRAWL_CLICK_ONCE:-true}
      - CRAWL_RANDOM_ORDER=${CRAWL_RANDOM_ORDER:-false}
      - SELENIUM_HUB_URL=http://selenium_chrome:4444/wd/hub
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j_password
    depends_on:
      - neo4j
    networks:
      - rede_dissertacao

  prompt_e2e:
    build:
      context: ./python_app/teste_prompt_e2e_semantico
    container_name: prompt_e2e_runner
    profiles:
      - tools
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j_password
      - PROMPT_E2E_BASE_URL=${TARGET_URL:-https://demowebshop.tricentis.com/}
      - PROMPT_E2E_SPECS_DIR=/app/specs
      - PROMPT_E2E_OUTPUT_DIR=/app/generated_prompts
    volumes:
      - ./python_app/teste_prompt_e2e_semantico/specs:/app/specs
      - ./python_app/teste_prompt_e2e_semantico/generated_prompts:/app/generated_prompts
    depends_on:
      - neo4j
      - selenium_chrome
    networks:
      - rede_dissertacao

  web_app:
    build:
      context: .
      dockerfile: ./web_app/Dockerfile
    container_name: semantic_e2e_web
    ports:
      - "8000:8000"
    environment:
      - SEMANTIC_E2E_REPO_ROOT=${PWD}
      - SEMANTIC_E2E_WEB_DATA_DIR=${PWD}/web_app_data
      - PWD=${PWD}
      - TARGET_URL=${TARGET_URL:-https://demowebshop.tricentis.com/}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j_password
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - neo4j
      - selenium_chrome
    networks:
      - rede_dissertacao

networks:
  rede_dissertacao:
    driver: bridge

volumes:
  neo4j_data:
